<!DOCTYPE html>
<html>
<head>
    <title>DOREMI SOlFÁ Móveis - Encomendas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <address class="ender">
            Tv. La Donna e Mobile, 134<br>
            Tel: (21) 91224-4881<br>
            contato@doremisolfa.com.br
        </address>
        <div class="imgLogo">
            <img src="Imagens/DoremisofaLogoTopo.png" alt="Logo Topo">
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="DoremisolfaMoveis.html">Apresentação</a></li>
            <li><a href="Doremi.html">Camas</a></li>
            <li><a href="Solfa.html">Sofás</a></li>
            <li><a href="Encomendas.html">Encomendas</a></li>
        </ul>
    </nav>
    <section>
        <form class="FormBox">
            <legend>Encomendas</legend>
            <fieldset class="FSLinhaInteira">
                <legend>Identificação</legend>       
                <div class="titulosEnco">
                    <label class="LabBox" for="email">Email:</label>
                    <input class="idEmail" id="email" type="email">

                    <input class="idPass" id="senha" type="password">
                    <label class="idPass" for="senha">Senha:</label>
                    <p class="loginCad">Se você ainda não tem cadastro, clique <a href="Cadastro.html">aqui</a>!</p>
                </div>
                
            </fieldset>
            <fieldset class="FSLinhaInteira">
                <legend>Lista de Produtos</legend>
                <div class="LinhaForm">

                <label class="LabBox">Produtos</label>
                <select class="lisSelProd">
                    <option selected value="none">Selecione um item</option>
                    <optgroup label="Cama Solteiro">
                        <option label="Simples 104 x 104 x 202">Simples 104 x 104 x 202</option>
                        <option label="Bicama 70 x 87 x 193">Bicama 70 x 87 x 193</option>
                    </optgroup>
                    <optgroup label="Cama Casal">
                        <option label="Simples 108 x 154 x 210">Simples 108 x 154 x 210</option>
                        <option label="Com gavetas 45 x 145 x 195">Com gavetas 45 x 145 x 195</option>
                    </optgroup>
                    <optgroup label="Sofá 2 lug.">
                        <option label="Retrátil 95 x 87-126 x 180 Linho Cru">Retrátil 95 x 87-126 x 180 Linho Cru</option>
                        <option label="Sofá-cama 95 x 97-150 x 180 Linho">Sofá-cama 95 x 97-150 x 180 Linho</option>
                    </optgroup>
                    <optgroup label="Sofá 3 lug.">
                        <option label="Retrátil 108 x 95-155 x 200 Suede">Retrátil 108 x 95-155 x 200 Suede</option>
                        <option label="Retrô 80 x 76 x 196 Veludo">Retrô 80 x 76 x 196 Veludo</option>
                    </optgroup>
                </select>


                <button class="btnIncluir">Incluir</button>
                </div>
                <textarea class="selProduto"></textarea>
                
                <input class="tituloValor" id="valor" type="number" step="0.01" min="0" max="9999999">
                <label class="tituloValor" for="valor">Valor:</label>
                </fieldset>
                 <fieldset class="FSLinhaInteira">
    <legend>Dados do Cartão</legend>
    
    <fieldset class="fsBandeira">
        <legend>Bandeira:</legend>
        <input type="radio" name="bandeira" id="visa" value="Visa" checked><a>Visa</a><br>
        <input type="radio" name="bandeira" id="master" value="Master"><a>Master</a><br>
        <input type="radio" name="bandeira" id="elo" value="Elo"><a>Elo</a>
    </fieldset>

    <div class="titulosEnco">
        <div class="LinhaForm">
            <label class="LabBox" for="cartao1">Número:</label>
            <input id="cartao1" name="cartao1" class="numDD" type="number" min="1" max="9999">
            <input id="cartao2" name="cartao2" class="numDD" type="number" min="1" max="9999">
            <input id="cartao3" name="cartao3" class="numDD" type="number" min="1" max="9999">
            <input id="cartao4" name="cartao4" class="numDD" type="number" min="1" max="9999">
        </div>
        
        <div class="LinhaForm">
            <label class="LabBox" for="mesValidade">Validade:</label>
            <input id="mesValidade" name="mesValidade" value="8" class="numDD" type="number" min="1" max="12">
            <a class="validadeBarra"> / </a>                                        
            <input id="anoValidade" name="anoValidade" value="2026" class="numQD" type="number" min="2024" max="2099">
        </div>
        
        <div class="LinhaForm">
            <label class="LabBox" for="parcelas">Parcelas:</label>
            <input id="parcelas" name="parcelas" value="1" class="numDD" type="number" min="1" max="24">
            <a class="xSemJuros"> x Sem Juros</a>
        </div>
    </div>
</fieldset>     
            
            <div class="botoes">
                <input type="button" value="Limpar">
                <input type="button" value="Enviar">
            </div>
        </form>
    
    </section>
</body>
</html>
